# Mosquitto 2.0: one plain MQTT listener (LAN only, firewalld + NetworkPolicy), users and topic
# access from users.sh / acl.
listener 1883
allow_anonymous false
password_file /mosquitto/private/passwords
acl_file /mosquitto/private/acl

# Retained messages survive restarts: ESPresense keeps each enrolled phone's identity key (IRK)
# as a retained message under espresense/settings/, so losing them means re-enrolling phones.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
