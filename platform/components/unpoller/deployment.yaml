apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  labels:
    app.kubernetes.io/name: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v5.5.0
          env:
            - name: UP_UNIFI_DEFAULT_URL
              value: https://192.168.1.1
            # Read-only local UniFi admin.
            - name: UP_UNIFI_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: unifi-readonly
                  key: user
            - name: UP_UNIFI_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-readonly
                  key: pass
            # The UDM Pro serves a self-signed certificate.
            - name: UP_UNIFI_DEFAULT_VERIFY_SSL
              value: "false"
            - name: UP_UNIFI_DEFAULT_SAVE_SITES
              value: "true"
            # Per-application traffic; many series. Enable deliberately.
            - name: UP_UNIFI_DEFAULT_SAVE_DPI
              value: "false"
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: 0.0.0.0:9130
            # Refresh the controller data as often as Prometheus scrapes. The UDM Pro's
            # counters change every 10 s (measured); feeds the dashboard's live WAN chart.
            - name: UP_PROMETHEUS_INTERVAL
              value: 10s
          ports:
            - name: metrics
              containerPort: 9130
          readinessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
