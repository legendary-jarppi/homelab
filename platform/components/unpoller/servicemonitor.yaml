apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpoller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  # One scrape per console: a slow or unreachable cabin (mobile link, VPN) cannot delay or fail
  # the home data, and each site has its own `up` series. `instance` names the console.
  endpoints:
    - port: metrics
      path: /scrape
      params:
        target: [https://192.168.1.1]
      # Every 30 s, like the cabin. At 10 s the UDM Pro's Network app needed 20–30 s per poll while
      # it ran short of memory (every few days, for about 2 days; 2026-10-19: 270 % CPU), so
      # abandoned polls piled up on top of each other and only 16 % of scrapes succeeded.
      interval: 30s
      scrapeTimeout: 25s
      relabelings:
        - targetLabel: instance
          replacement: https://192.168.1.1
    - port: metrics
      path: /scrape
      params:
        target: [https://192.168.20.1]
      # The cabin over the VPN and its mobile link: logging in alone takes about a second.
      interval: 30s
      scrapeTimeout: 25s
      relabelings:
        - targetLabel: instance
          replacement: https://192.168.20.1
