apiVersion: v1
kind: Service
metadata:
  name: go2rtc
  labels:
    app.kubernetes.io/name: go2rtc
spec:
  selector:
    app.kubernetes.io/name: go2rtc
  ports:
    - name: http
      port: 1984
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go2rtc
spec:
  ingressClassName: traefik
  rules:
    - host: cameras.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go2rtc
                port:
                  name: http
