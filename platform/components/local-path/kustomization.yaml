# local-path-provisioner, replacing the k3s-bundled copy (disabled in k3s/config.yaml).
# upstream.yaml: https://github.com/rancher/local-path-provisioner/blob/v0.0.37/deploy/local-path-storage.yaml
# Apply: kubectl apply -k platform/components/local-path
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream.yaml
patches:
  - path: config-patch.yaml
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
