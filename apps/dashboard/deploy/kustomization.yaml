# Home dashboard at http://dashboard.lab.internal
# Needs secret dashboard-auth (PASSCODE, SESSION_SECRET), not in git; optional dashboard-workout
# (WORKOUT_TOKEN), dashboard-calendar (CALENDAR_ICS_URL) and dashboard-packages (DHL_API_KEY,
# UPS_CLIENT_ID, UPS_CLIENT_SECRET); see apps/dashboard/README.md.
# Build + apply: apps/dashboard/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dashboard
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service-ingress.yaml
images:
  - name: localhost/home-dashboard
    newTag: "20261007-101752"
configMapGenerator:
  # Hashed name: changes roll the pod.
  - name: dashboard-config
    literals:
      # Origin per request from Traefik's headers, not a fixed ORIGIN: Safari opens
      # https://dashboard.lab.internal on its own, and a fixed http origin made SvelteKit's
      # CSRF check reject those logins (403). Traefik is the only way in, so these are trusted.
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      # Traefik appends the client address; used for login rate limiting.
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      - PROMETHEUS_URL=http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      - GO2RTC_URL=http://go2rtc.go2rtc.svc:1984
      # id:label pairs; ids are go2rtc stream names.
      - CAMERAS=front-door:Front door,backyard:Backyard,carport:Carport
      - UNIFI_SOURCE=https://192.168.1.1
      # Weather (Open-Meteo), name:latitude:longitude; the first gets the hourly forecast.
      - WEATHER_LOCATIONS=Espoo:60.2052:24.6522,Ristiina:61.5058:27.2464
      # This week's workouts (apps/workout, cluster-internal).
      - WORKOUT_URL=http://web.workout.svc:3000
      # Opened when the workout card is tapped.
      - WORKOUT_APP_URL=http://workout.lab.internal
