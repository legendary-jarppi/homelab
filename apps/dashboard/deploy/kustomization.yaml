# Home dashboard at http://dashboard.lab.internal and https://dashboard.shillyshally.org (no login of
# its own; see apps/dashboard/README.md#access). Optional secrets, not in git: dashboard-workout
# (WORKOUT_TOKEN), dashboard-lists (LISTS_TOKEN), dashboard-calendar (CALENDAR_ICS_URL, or
# GOOGLE_SERVICE_ACCOUNT + CALENDAR_ID), dashboard-packages (UPS_CLIENT_ID, UPS_CLIENT_SECRET),
# dashboard-protect (PROTECT_USER, PROTECT_PASS) and dashboard-notify (NOTIFY_TOKEN).
# Build + apply: apps/dashboard/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dashboard
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service-ingress.yaml
images:
  - name: localhost/home-dashboard
    newTag: "20261101-204105"
configMapGenerator:
  # Hashed name: changes roll the pod.
  - name: dashboard-config
    literals:
      # Origin per request from the proxy's headers, not a fixed ORIGIN: Safari opens
      # https://dashboard.lab.internal on its own. The only ways in are Traefik (lab.internal) and
      # cloudflared (dashboard.shillyshally.org: Host is the public name, X-Forwarded-Proto https),
      # so these are trusted.
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - PROMETHEUS_URL=http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      - GO2RTC_URL=http://go2rtc.go2rtc.svc:1984
      # id:label pairs; ids are go2rtc stream names. The cabin-* tiles show Protect snapshots
      # (CABIN_PROTECT_CAMERAS below); go2rtc only plays them live.
      - CAMERAS=front-door:Front door,backyard:Backyard,carport:Carport,cabin-driveway:Driveway,cabin-door:Cabin door,cabin-yard:Yard from cabin,cabin-sauna-yard:Yard from sauna,cabin-lake:Lake,cabin-drain-field:Drain field
      - UNIFI_SOURCE=https://192.168.1.1
      # Weather (Open-Meteo), name:latitude:longitude; the first gets the hourly forecast.
      - WEATHER_LOCATIONS=Espoo:60.2052:24.6522,Ristiina:61.5058:27.2464
      # This week's workouts (apps/workout, cluster-internal).
      - WORKOUT_URL=http://web.workout.svc:3000
      # Opened when the workout card is tapped.
      - WORKOUT_APP_URL=http://workout.lab.internal
      # Lists marked "Show on dashboard" (apps/lists, cluster-internal), and where tapping opens them.
      - LISTS_URL=http://web.lists.svc:3000
      - LISTS_APP_URL=http://lists.lab.internal
      # The Homelab tab's link to apps/homelab (components, network and devices).
      - HOMELAB_APP_URL=http://homelab.lab.internal
      # Who is home (apps/presence, cluster-internal).
      - PRESENCE_URL=http://presence.presence.svc:8080
      # Notifications through apps/notify (cluster-internal; token in secret dashboard-notify).
      - NOTIFY_URL=http://web.notify.svc:3000
      # Opened when a notification is tapped: the public address, which works away from home too.
      - DASHBOARD_APP_URL=https://dashboard.shillyshally.org
      # Cabin camera snapshots (apps/cabin-camera, cluster-internal).
      - CABIN_CAMERA_URL=http://snapshots.cabin-camera.svc:8080
      # The cabin's heat pumps (apps/climate, cluster-internal): the Cabin tab.
      - CLIMATE_URL=http://climate.climate.svc:8080
      # The cabin telescope's imaging session and frame previews (apps/telescope, cluster-internal): the Telescope tab.
      - TELESCOPE_URL=http://telescope.telescope.svc:8080
      # Telescope site for the tab's "Tonight" card (name:latitude:longitude, as the ASIAIR reports it).
      - TELESCOPE_SITE=Ristiina:61.496:27.576
      # UniFi Protect motion events for the Cameras tab (login in secret dashboard-protect).
      - PROTECT_URL=https://192.168.1.1
      # Protect camera name:label:CAMERAS id, in display order. The id links the camera's live tile and
      # video to its recordings (the viewer's timeline).
      - PROTECT_CAMERAS=Ulko-ovi:Front door:front-door,Takapiha:Backyard:backyard,Autokatos:Carport:carport
      # The cabin's Protect (UCG Max, over the Site Magic VPN; same login): its cameras' events and
      # recordings, and snapshots for their live tiles (cheaper than go2rtc frames over its mobile link).
      - CABIN_PROTECT_URL=https://192.168.20.1
      - CABIN_PROTECT_CAMERAS=Sisääntulotie:Driveway:cabin-driveway,Etuovi:Cabin door:cabin-door,Piha talolta:Yard from cabin:cabin-yard,Piha saunalta:Yard from sauna:cabin-sauna-yard,Järvi saunalta:Lake:cabin-lake,Imeytyskenttä:Drain field:cabin-drain-field
      # BluOS players (Bluesound NODE) for the Music cards, site:address:label (the label shows until the
      # player has answered; then its own name). Fixed DHCP addresses; the cabin's over the Site Magic VPN.
      - BLUOS_PLAYERS=home:192.168.1.63:Jauzan Luola,home:192.168.1.168:Yläkerta,cabin:192.168.20.40:Elinan Kulma
      # The highest volume (0–100) the dashboard sets; it also lowers a louder player to this before starting playback.
      - BLUOS_MAX_VOLUME=30
