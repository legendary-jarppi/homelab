apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruuvi
  labels:
    app.kubernetes.io/name: ruuvi
spec:
  # Latest readings live in memory; a second replica would only duplicate the series.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ruuvi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ruuvi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ruuvi
          # Built locally and imported into k3s (deploy.sh); never pulled.
          image: localhost/ruuvi
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: ruuvi-config
            # MQTT_USERNAME, MQTT_PASSWORD for Mosquitto (platform/components/mosquitto/users.sh).
            - secretRef:
                name: ruuvi-mqtt
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: ruuvi
  labels:
    app.kubernetes.io/name: ruuvi
spec:
  selector:
    app.kubernetes.io/name: ruuvi
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ruuvi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ruuvi
  endpoints:
    - port: http
      interval: 30s
