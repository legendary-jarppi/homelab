# Enforced by k3s's embedded network policy controller.
#   ruuvi <- Prometheus (scrape)
#   ruuvi -> Mosquitto (the Ruuvi Gateway's readings), DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ruuvi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ruuvi
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mosquitto
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mosquitto
      ports:
        - port: 1883
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
