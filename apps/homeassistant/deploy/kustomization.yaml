# Home Assistant at http://homeassistant.lab.internal (see apps/homeassistant/README.md).
# Optional secret homeassistant-mqtt (username, password) from platform/components/mosquitto/users.sh,
# entered in the MQTT integration.
# Apply: kubectl apply -k apps/homeassistant/deploy
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
resources:
  - namespace.yaml
  - app.yaml
configMapGenerator:
  # Hashed name: a change to configuration.yaml rolls the pod.
  - name: homeassistant-configuration
    files:
      - configuration.yaml
