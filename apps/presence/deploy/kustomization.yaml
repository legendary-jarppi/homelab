# Presence (who is home), cluster-internal at http://presence.presence.svc:8080
# Needs secret presence-people (people.json), not in git; see apps/presence/README.md.
# Build + apply: apps/presence/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: presence
resources:
  - namespace.yaml
  - app.yaml
  - networkpolicy.yaml
images:
  - name: localhost/presence
    newTag: "20261007-140356"
configMapGenerator:
  # Hashed name: changes roll the pod.
  - name: presence-config
    literals:
      - PROMETHEUS_URL=http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      # UnPoller's source label for the home UDM Pro (same as the dashboard's UNIFI_SOURCE).
      - UNIFI_SOURCE=https://192.168.1.1
      # Unseen this long: away. Phones drop off Wi-Fi briefly now and then.
      - AWAY_AFTER_MIN=10
