<script id="ukko-initial-state">window.__INITIAL__STATE__={"pageId":"article","pageData":{"article":{"id":"74-20240637","language":"fi","url":{"full":"https://yle.fi/a/74-20240637"},"headline":{"video":{"playbackBehaviour":"illustrational","caption":"Anna Mantere opetti lapsia kotona, koska katsoi, että koulussa keskitytään vääriin asioihin. Leikkaus: Marja Väänänen / Yle","type":"video","id":"1-78563924"},"image":{"alt":"Anna Mantereen lapset Janakkalan kirjastossa.","source":"Juha Kivioja / Yle","aspect":1.7777777777777777,"caption":"Kotiopetuksessa olevat lapset lukevat kirjastossa.","id":"39-16979636a8efffedd08e","type":"image","copyright":[{"value":"Juha Kivioja / Yle","language":"und"}],"crops":[{"aspect":1.78,"coordinates":{"y":272,"width":6000,"x":0,"height":3375},"name":"16:9"},{"aspect":0.67,"coordinates":{"y":0,"width":2666,"x":1762,"height":4000},"name":"2:3"},{"aspect":1,"coordinates":{"y":0,"width":4000,"x":596,"height":4000},"name":"1:1"}],"height":4000,"licence":{"properties":[],"name":[{"value":"Yle","language":"und"}],"id":"6"},"created":"2026-08-26T18:02:22+03:00","modified":"2026-08-26T18:19:22+03:00","version":"1787757511","width":6000,"recommendedFormat":"jpg"},"alternate":["Mantereet valitsivat kotiopetuksen jo ennen lasten syntymää – kolmen vuoden jälkeen äidille riitti","Anna Mantere opetti lapsiaan kotona, kunnes törmäsi seinään – ”Lapset saa nytten tuta, mitä se koulukoulu on”","Anna Mantere kotiopetti lapsiaan, kunnes luovutti: ”Menkää sitten kouluun ja sanokaa siellä ei”"],"promotional":"Anna Mantere kotiopetti lapsiaan, kunnes luovutti: ”Menkää sitten kouluun ja sanokaa siellä ei”","full":"Anna Mantere kotiopetti lapsiaan, kunnes luovutti: ”Menkää sitten kouluun ja sanokaa siellä ei”"},"lead":"Anna Mantere vannoi: en laita lapsiani kouluun, vaan opetan heitä kotona. Vuosien jälkeen hän lopetti. Nyt äiti kertoo, miksi.","mainMedia":[{"playbackBehaviour":"illustrational","caption":"Anna Mantere opetti lapsia kotona, koska katsoi, että koulussa keskitytään vääriin asioihin. Leikkaus: Marja Väänänen / Yle","type":"video","id":"1-78563924"}],"authors":[{"organization":"Yle","role":"toimittaja","id":"56-74-1881","name":"Sara Hussein","type":"Person"},{"organization":"Yle","role":"toimittaja","id":"56-74-1176","name":"Jessica Stolzmann","type":"Person"},{"organization":"Yle","role":"kuvat ja videot","id":"56-74-120","name":"Juha Kivioja","type":"Person"},{"organization":"Yle","role":"tuottaja","id":"56-74-23","name":"Eelis Bjurström","type":"Person"}],"datePublished":"2026-10-04T18:00:35+0300","dateContentModified":"2026-10-04T18:00:35+0300","dateJsonModified":"2026-10-04T18:00:33+0300","publisher":{"name":"Yle Uutiset"},"publication":"uutiset","coverage":"national","content":[{"level":1,"text":"Anna Mantere kotiopetti mutta luovutti: ”Menkää sitten kouluun”","type":"heading"},{"playbackBehaviour":"illustrational","caption":"Anna Mantere opetti lapsia kotona, koska katsoi, että koulussa keskitytään vääriin asioihin. Leikkaus: Marja Väänänen / Yle","type":"video","id":"1-78563924"},{"text":"Anna Mantere vannoi: en laita lapsiani kouluun, vaan opetan heitä kotona. Vuosien jälkeen hän lopetti. Nyt äiti kertoo, miksi.","type":"text"},{"text":"– Mä oon päättänyt kotikouluttaa ennen kuin mun ensimmäinen lapsi on syntynytkään, **Anna Mantere** sanoo Janakkalan pääkirjastossa.","type":"text"},{"text":"Hänellä on mukanaan kolmilapsisen perheen kuopus, kolmevuotias **Felix**. Siskot ovat lähistöllä.","type":"text"},{"context":"ai_summary","behaviour":"collapsed","content":[{"text":"Juttu tiivistettynä","level":2,"type":"heading"},{"items":["Kotioppijoita on Suomessa noin tuhat. Määrä on kolminkertaistunut seitsemässä vuodessa.","Suojelupoliisi varoittaa valvonnan puutteista ja ääriajattelun riskistä. MOT löysi vakavia laiminlyöntejä.","Mantere ei pidä valvonnan kiristämistä hyvänä ideana."],"type":"bullet-list"}],"type":"aside"},{"text":"Mantere kertoo haluavansa viettää kolmen lapsensa kanssa mahdollisimman paljon aikaa yhdessä, jotta suhteet pysyvät läheisinä. Hän sanoo pystyvänsä lukemaan lasten pienetkin eleet.","type":"text"},{"text":"Aika on kuin liimaa perheelle, Mantere vertaa.","type":"text"},{"text":"Koulussa käyminen vie yhteistä aikaa, mikä vähentää liimaa.","type":"text"},{"text":"Koulussa kaikkien pitää mennä yhteen muottiin, Mantere sanoo. Kaikki seuraavat samoja aikatauluja ja ohjeita, ja pahimmillaan lasta kiusataan.","type":"text"},{"text":"Lapset saattavat oppia muilta esimerkiksi kiroilun. Ei hyvä!","type":"text"},{"text":"Mantereen mielestä tietty maailmankuva näkyy koulujen opetuksessa. Esimerkiksi ilmastosta halutaan luoda tietynlainen käsitys.","type":"text"},{"text":"Hän pitää ihmeenä, jos 18-vuotias haluaa vielä lapsia, koska koulukirjoissa kirjoitetaan hänen mielestään niin paljon ilmastoahdistuksesta.","type":"text"},{"text":"– Sitten ihmetellään, miksi syntyvyys on niin matalaa.","type":"text"},{"text":"Toinenkin asia vaivaa häntä.","type":"text"},{"text":"– Opetetaan, että tytöstä voi tehdä pojan ja pojasta voi tehdä tytön. Voidaan miettiä, ovatko ne biologisia faktoja vai ei.","type":"text"},{"text":"**Mantere kertoo koulun opettajiin liittyvästä huolestaan näin:**","type":"text"},{"playbackBehaviour":"autoplay","caption":"Leikkaus: Marja Väänänen / Yle.","type":"video","id":"1-78562895"},{"text":"Mantere kertoo kokevansa, että Suomi on yhden totuuden maa: Lapset pitää laittaa kouluun.","type":"text"},{"text":"Siksi ihmiset ympärillä ovat kyseenalaistaneet hänen valintaansa, hän analysoi.","type":"text"},{"text":"– Täällä ei siedetä moniäänisyyttä tai saa olla erilainen, kuten vaikka Yhdysvalloissa.","type":"text"},{"behaviour":"collapsed","content":[{"text":"Kotiopetus Suomessa","level":2,"type":"heading"},{"items":["Suomessa on tällä hetkellä noin tuhat kotioppijaa. Määrä on kolminkertaistunut seitsemässä vuodessa.","Päätöksestä opettaa kotona riittää ilmoitus kunnalle.","Kotioppilaan oppimista seuraa tutkiva opettaja. Lainsäädännössä ei ole määritelty, kuinka usein valvontatilaisuuksia järjestetään. Yleinen käytäntö on, että niitä on yhdestä kolmeen kertaan vuodessa."],"type":"bullet-list"},{"text":"*Lähteet: Opetushallitus, MOT:n selvitys*","type":"text"}],"type":"aside"},{"text":"Suojelupoliisi varoitti kotiopetuksen yleistymisestä","level":2,"type":"heading"},{"text":"Miksi kotiopetuksesta puhutaan nyt niin paljon? Onhan sitä tehty Suomessa ja maailmalla iät ja ajat.","type":"text"},{"text":"Lain mukaan vanhemmalla on oikeus päättää, laittaako lapset kouluun vai opettaako niitä kotona. Päätöksestä riittää ilmoitus kunnalle.","type":"text"},{"text":"Keväällä keskustelu kuumeni: [Suojelupoliisi](https://supo.fi/asuinalueiden-eriytyminen-luo-uusia-kansallisen-turvallisuuden-uhkia) (supo) sanoi pitävänsä kotiopetuksen yleistymistä uhkana Suomen turvallisuudelle.","type":"text"},{"text":"Supon mukaan viranomaisten on erittäin vaikea valvoa kotiopetuksessa ja epävirallisissa kotiopetuskouluissa tapahtuvaa opetusta.","type":"text"},{"text":"Lisäksi uutisointi kadonneesta Karfien perheestä on herättänyt keskustelua kotiopetuksesta. Perhe katosi jäljettömiin noin kaksi vuotta sitten. Tapaukseen liittyi kiista kotiopetuksesta.","type":"text"},{"text":"Ylen MOT tutki väitteitä, että kotiopetus olisi vaaraksi lapsen oikeuksille ja jopa kansalliselle turvallisuudelle juuri julkaistussa dokumentissa *Meillä ei mennä kouluun*:","type":"text"},{"text":"Tutkinnan aikana selvisi toinenkin tapaus, jossa vakavasti laiminlyötyä lasta pidettiin piilossa viranomaisilta. Lapsi oli ilmoitettu kotiopetukseen.","type":"text"},{"text":"MOT tietää myös useista tapauksista, joissa tutkivilla opettajilla on ollut vaikeuksia saada yhteys perheeseen tai tapaamista sovittua. Aina tutkivat opettajat eivät edes tiedä, missä maassa lapsi on.","type":"text"},{"text":"Lastensuojelu ei voi juurikaan puuttua oppimiseen, jos kotioloissa on muutoin asiat kunnossa. Poliisille voi tehdä rikosilmoituksen oppivelvollisen valvonnan laiminlyönnistä. Suomessa tuomiot kotiopetukseen liittyen ovat kuitenkin yksittäisiä.","type":"text"},{"text":"Suojelupoliisin mukaan koululla on keskeinen merkitys lasten ja nuorten väkivaltaisen radikalisoitumisen ja väkivaltaisen ekstremismin ennaltaehkäisyssä.","type":"text"},{"text":"Huoli on, että kotiopetus voi vaikuttaa lasten radikalisoitumiseen.","type":"text"},{"text":"Erityisesti supo on huolissaan ääri-ideologisesta kuten esimerkiksi äärioikeistolaisesta tai radikaali-islamistisesta opetuksesta, supon erikoistutkija **Anna Santaholma** muotoili [keväällä](https://yle.fi/a/74-20221563).","type":"text"},{"text":"Opetushallitus aloitti keväällä selvityksen kotiopetuksesta, jonka on kerrottu valmistuvan syksyllä. Opetushallituksesta ei kuitenkaan kerrota, miten selvitys on edennyt.","type":"text"},{"text":"Opetusministeri **Anders Adlercreutz** (r) on aiemmin [väläyttänyt koulupakkoa](https://yle.fi/a/74-20225271): silloin lasta ei saisi opettaa kotona. Niin on esimerkiksi Ruotsissa.","type":"text"},{"displayStyle":"normal","alt":"Anna Mantereen lapset lukevat kirjaa Janakkalan kirjastossa.","source":"Juha Kivioja / Yle","aspect":1,"caption":"Filippa, 8, lukee usein pikkuveljelleen iltasatuja. Arkinen hetki on myös kotioppimista.","id":"39-16979676a8f000166987","type":"image","copyright":[{"value":"Juha Kivioja / Yle","language":"und"}],"crops":[{"aspect":1.78,"coordinates":{"y":2545,"width":3857,"x":0,"height":2169},"name":"16:9"},{"aspect":0.67,"coordinates":{"y":0,"width":3857,"x":0,"height":5794},"name":"2:3"},{"aspect":1,"coordinates":{"y":1844,"width":3857,"x":11,"height":3857},"name":"1:1"}],"height":5809,"licence":{"properties":[],"name":[{"value":"Yle","language":"und"}],"id":"6"},"created":"2026-08-26T18:02:25+03:00","modified":"2026-08-26T18:19:23+03:00","version":"1787757539","width":3873,"recommendedFormat":"jpg"},{"text":"Manteretta puistattaa ajatus valvonnan kiristymisestä.","type":"text"},{"text":"– Se lisää vaan isoveli valvoo -meininkiä meidän yhteiskunnassa.","type":"text"},{"text":"Häntä harmittaa ajatus, että jokaisen lapsen pitäisi oppia samaan tahtiin.","type":"text"},{"text":"Mantere kertoo tuntevansa vain perheitä, jotka näkevät erittäin paljon vaivaa lastensa oppimisen eteen. Hän ei tunnista ilmiötä, että lapsia eristettäisiin.","type":"text"},{"text":"– Jos jossakin on lapsi, jota oikeasti pidetään kellarissa kahleissa, niin menkää ja pelastakaa se lapsi!","type":"text"},{"text":"Lehtijutut johtivat lastensuojeluilmoituksiin","level":2,"type":"heading"},{"text":"Anna Mantere ja hänen puolisonsa ovat kertoneet perheensä kotikoulusta mediassa aiemminkin.","type":"text"},{"text":"Sen jälkeen lapsista on tehty kaksi lastensuojeluilmoitusta.","type":"text"},{"displayStyle":"normal","alt":"Anna Mantere Janakkalan kirjastossa.","source":"Juha Kivioja / Yle","aspect":0.6666666666666666,"caption":"Mantere ja hänen puolisonsa ovat aiemmin antaneet haastattelut kotiopetuksesta Helsingin Sanomille ja Janakkalan Sanomille. He saivat osakseen kritiikkiä.","id":"39-16979646a8effff9e2ea","type":"image","copyright":[{"value":"Juha Kivioja / Yle","language":"und"}],"crops":[{"aspect":1.78,"coordinates":{"y":1054,"width":3739,"x":0,"height":2103},"name":"16:9"},{"aspect":0.67,"coordinates":{"y":0,"width":3740,"x":0,"height":5610},"name":"2:3"},{"aspect":1,"coordinates":{"y":127,"width":3739,"x":0,"height":3739},"name":"1:1"}],"height":5610,"licence":{"properties":[],"name":[{"value":"Yle","language":"und"}],"id":"6"},"created":"2026-08-26T18:02:23+03:00","modified":"2026-08-26T18:19:22+03:00","version":"1787757521","width":3740,"recommendedFormat":"jpg"},{"text":"Toisessa mainitaan huoli siitä, että lapsia ei päästetä kouluun.","type":"text"},{"text":"– Mun oikeuteni on, että mä en laita lapsiani kouluun, Mantere vastaa.","type":"text"},{"text":"Lastensuojeluilmoituksissa esitettiin myös huoli ”helvetillä pelottelusta”, koska Mantere on uskossa.","type":"text"},{"text":"Hän pitää tarpeettomana, että joutui selittelemään viranomaiselle ”helvettikäsitystään” ja perhettään lehtijutun takia.","type":"text"},{"text":"Suomessa kun on kuitenkin uskonnonvapaus, eikä jutussa edes mainittu helvettiä.","type":"text"},{"text":"Äidin lomavuosi kotikouluttamisesta","level":2,"type":"heading"},{"text":"Mantere oli aina varma päätöksestään kotiopettaa, kunnes yhtäkkiä ajatus kääntyi päälaelleen.","type":"text"},{"text":"– Tuli se maanantai-aamu, kun sain \\[lapsiltani\\] yhden ”enkä tee” liikaa, Mantere kertoo.","type":"text"},{"text":"Kotiopetus on ympärivuorokautista työtä, joka ottaa veronsa. Raja tuli vastaan.","type":"text"},{"text":"Mantere kertoo sanoneensa lapsilleen:","type":"text"},{"text":"– Menkää sitten kouluun ja sanokaa siellä ”enkä tee”. Lapset saa nytten tuta, mitä se koulukoulu on.","type":"text"},{"displayStyle":"normal","alt":"Anna Mantere ja lapset kirjaston pihalla Janakkalassa.","source":"Juha Kivioja / Yle","aspect":1.5,"caption":"Siskokset polkevat nyt joka päivä kouluun.","id":"39-16979596a8efffc6d7f7","type":"image","copyright":[{"value":"Juha Kivioja / Yle","language":"und"}],"crops":[{"aspect":1.78,"coordinates":{"y":515,"width":5867,"x":1,"height":3300},"name":"16:9"},{"aspect":0.67,"coordinates":{"y":0,"width":2607,"x":266,"height":3911},"name":"2:3"},{"aspect":1,"coordinates":{"y":0,"width":3911,"x":310,"height":3911},"name":"1:1"}],"height":3912,"licence":{"properties":[],"name":[{"value":"Yle","language":"und"}],"id":"6"},"created":"2026-08-26T18:02:20+03:00","modified":"2026-08-26T18:19:21+03:00","version":"1787757484","width":5868,"recommendedFormat":"jpg"},{"text":"Iltapäivällä Mantere hakee sisarukset koulusta kirjastoon.","type":"text"},{"text":"Sekä **Sofi** että **Filippa** kertovat koulupäivän menneen hyvin. Filippa sanoo pitävänsä koulusta, koska siellä on paljon uusia kavereita. Toisaalta kotikoulussa sai nukkua pitkään.","type":"text"},{"text":"Koulussa lapset kohtaavat erilaisia, vaikeitakin sosiaalisia tilanteita. Miltä se tuntuu äidistä?","type":"text"},{"text":"– Kai jokainen vanhempi haluaisi suojella lapsensa kaikelta mahdolliselta kivulta ja tuskalta, mutta eihän me voida tehdä niin. Jokainen päivä, jonka olen voinut antaa lasten kasvaa ja vahvistua kotona rauhassa, on tehnyt heistä valmiimpia kohtaamaan sen maailman, Mantere vastaa.","type":"text"},{"text":"Tänä syksynä lapset viettävät päivänsä siis koulussa ja perhepäivähoidossa.","type":"text"},{"text":"Vapautuneella ajalla äiti sanoo aluksi haluavansa käydä kirpputoreilla, lukea kirjaa ja vaikka kylpeä. Hän ryhtyy myös yrittäjäksi.","type":"text"},{"text":"Miltä uusi elämänvaihe tuntuu?","type":"text"},{"text":"– No sanotaan näin, että jos lapseni valittavat jossain vaiheessa kouluvuotta, että heitä väsyttää, niin minua ei kiinnosta, Mantere sanoo nauraen.","type":"text"},{"text":"Koulua on nyt takana viikkoja. Mantere toteaa, että kotiopetuksessa lapset eivät jää akateemisesti mistään paitsi.","type":"text"},{"text":"– Lisäksi siellä on paljon kaikenlaista ylimääräistä höpönlöpöä opetussuunnitelman ulkopuolelta. Koulun tulisi olla ennen kaikkea akateemisen oppimisen ja elämäntaitojen opinahjo, ei ideologisen kasvatuksen paikka.","type":"text"},{"text":"Lapset ovat innoissaan uusista kavereista. Äidin mielestä kaikki sosiaaliset suhteet eivät aina ole hyvä asia.","type":"text"},{"text":"Häntä harmittaa, että yhteinen aika lasten kanssa vähenee, mikä heikentää perheen liimaa.","type":"text"},{"displayStyle":"normal","alt":"Anna Mantere ja lapset nauttivat jäätelöstä kaupan pihalla.","source":"Juha Kivioja / Yle","aspect":1.5001350256548744,"caption":"Perhe viettää nyt vähemmän aikaa yhdessä.","id":"39-16979566a8efffa75e3a","type":"image","copyright":[{"value":"Juha Kivioja / Yle","language":"und"}],"crops":[{"aspect":1.78,"coordinates":{"y":407,"width":5554,"x":0,"height":3124},"name":"16:9"},{"aspect":0.67,"coordinates":{"y":0,"width":2458,"x":874,"height":3688},"name":"2:3"},{"aspect":1,"coordinates":{"y":0,"width":3688,"x":961,"height":3688},"name":"1:1"}],"height":3703,"licence":{"properties":[],"name":[{"value":"Yle","language":"und"}],"id":"6"},"created":"2026-08-26T18:02:18+03:00","modified":"2026-08-26T18:19:20+03:00","version":"1787757468","width":5555,"recommendedFormat":"jpg"},{"formId":"83-3a3225466c774ec586f979fe7ee9899b","type":"form"}],"subjects":[{"title":{"fi":"koulutus"}},{"title":{"fi":"kotiopetus"}},{"title":{"fi":"perheet"}},{"title":{"fi":"Koulutus ja kasvatus"}},{"title":{"fi":"lapset"}},{"title":{"fi":"MOT"}},{"title":{"fi":"kotimaa"}}],"properties":["audio:enabled","priority:normal"],"journalisticStyle":"feature","topic":{"description":{"fi":"Ylen tutkivan journalismin viikko-ohjelma, joka käsittelee yhteiskunnallisesti tärkeitä aiheita. MOT pyrkii paljastamaan epäkohtia ja väärinkäytöksiä sekä löytämään ilmiöiden taustalla olevia syitä. MOTia on esitetty vuodesta 1996 lähtien Yle TV1 -kanavalla. ","sv":"Yles grävande journalistik-program som varje vecka tar upp ett samhällsviktigt ämne. Programmet försöker avslöja missförhållanden och missbruk samt hitta orsakerna till olika fenomen. MOT har sänts sedan 1996 på Yle TV1-kanalen.","en":"tv program","ru":null,"se":null},"exactMatch":["wikidata:Q18679790","leiki:focus100k_na_712042"],"updated":"2021-04-30T11:39:18+03:00","alternativeIds":["18-38374","18-159137"],"title":{"fi":"MOT","sv":"MOT","en":"MOT","ru":null,"se":null},"types":["TVProgram","Organization","Program","Concept","EditorialSection"],"id":"18-186623","contentHits":6186,"shortTitle":{"fi":null,"sv":null,"en":null,"ru":null,"se":null}}}}};</script>
