<script>window.App={"state":{"articles":{"13f52db7-8a39-4c49-beb3-9a24dc8a1ede":{"items":{"article_id":"13f52db7-8a39-4c49-beb3-9a24dc8a1ede","article_version_id":"79d51a159a9a4cc0a5f0f08e6cefb2835670fd3ca1c121ce39ee9fe01e73add6","canonical_title":"Elfyn Evans heitti jo hanskat tiskiin: ”Olin jo varma, että kaikki on menetetty”","ads_enabled":true,"commenting_enabled":true,"news_value":5,"lead":"Walesilainen Elfyn Evans valloitti vihdoin rallin maailmanmestaruuden.","headline":"Se oli siinä – Elfyn Evansilta raadollinen paljastus","banner":null,"title":"Se oli siinä – Elfyn Evansilta raadollinen paljastus","seo_title":"Se oli siinä – Elfyn Evansilta raadollinen paljastus","body":[{"type":"paragraph","items":[{"type":"bold","items":[{"text":"Elfyn Evans","type":"text"}]},{"text":" on kiertänyt MM-sarjaa pääluokassa jo kaudesta 2014 lähtien ja takataskussa oli ennestään viisi hopeamitalia. Nyt Evans onnistui kartturinsa ","type":"text"},{"type":"bold","items":[{"text":"Scott Martinin","type":"text"}]},{"text":" kanssa toteuttamaan unelmansa, vaikka tiukoille se meni.","type":"text"}]},{"type":"advertisement","id":"almad-content-1"},{"type":"paragraph","items":[{"type":"bold","items":[{"text":"Oliver Solberg","type":"text"}]},{"text":" oli kiinni MM-tittelissä, mutta menetti peliin ulosajoon 200 metriä ennen maalia. Vaikka Solberg pääsi maaliin ja voitti kisan, Power Stagen ja supersunnuntain pistemenetykset ratkaisivat pelin Evansille.","type":"text"}]},{"type":"paragraph","items":[{"text":"– Tämä on ollut hieman epätodellinen kisa. Siihen on mahtunut todella paljon ylä- ja alamäkiä. Rehellisesti sanottuna olin jo aika varma, ettei mestaruus tulisi Power Stagen -suoritukseni jälkeen. Mutta tämä osoittaa jälleen, että tässä lajissa voi tapahtua mitä tahansa. Ja tänään todella tapahtui, Evans huokaisi.","type":"text"}]},{"type":"paragraph","items":[{"text":"– Kun Oliver selvitti viimeisen vasemmalle kääntyvän neulansilmämutkan, ajattelin, että homma oli käytännössä siinä. Siitä oli maaliin enemmän tai vähemmän kaasu pohjassa, ehkä vain pari kolme jarrutusta.","type":"text"}]},{"type":"paragraph","items":[{"text":"– Olin siis melko varma, että homma oli jo selvä ja kaikki on menetetty. Totta kai yllätyin siitä, mitä tapahtui, ja tietenkin harmitti nähdä hänen tekevän tuollaisen virheen.","type":"text"}]},{"text":"Perheet mukana","type":"subheadline"},{"type":"paragraph","items":[{"text":"Evans ja Martin pääsivät juhlimaan mestaruutta perheidensä kanssa.","type":"text"}]},{"type":"paragraph","items":[{"text":"Sardinian ralli on monesti yksi kauden kohokohdista tiimeille, koska saarelle tuodaan yleensä myös perheet mukaan.","type":"text"}]},{"type":"paragraph","items":[{"text":"– Tietenkin kaikki tulivat tänne tänä viikonloppuna toiveikkaina. Välillä jo ajattelin, että olin raahannut heidät Sardiniaan vain lomamatkalle. Mutta onneksi nyt meillä on jotain juhlittavaa, Evans naureskeli.","type":"text"}]},{"type":"paragraph","items":[{"text":"Evans on tunnettu varsin rauhallisena kaverina, joka ei juuri puheillaan revittele. Sama trendi jatkui myös mestaruuden jälkeen. Perheenisä kokee, että maailmassa on paljon muita tärkeämpiä asioita kuin ralli.","type":"text"}]},{"type":"paragraph","items":[{"text":"– En usko, että tämä muuttaa elämääni kovinkaan paljon. Minulla on ollut pitkä ja hieno ura. Tämä oli tietenkin se kaikkein suurin tavoite, ja nyt olemme saavuttaneet sen. Mutta elämä jatkuu tästä eteenpäin kuten ennenkin, Evans tokaisi.","type":"text"}]},{"type":"paragraph","items":[{"text":"– Tämä on hieno palkinto ja samalla tapa kiittää kaikkia niitä, jotka ovat tukeneet minua koko urani ajan. Tuntuu siltä, että saavutimme tämän yhdessä – tiimi, perhe ja tietenkin myös Scott.","type":"text"}]},{"type":"paragraph","items":[{"text":"Juuri kartanlukija Martin sai Evansilta erityiset kiitokset. Sunnuntaina rengasrikon jälkeen tv-kuvissa näkyi, miten kokenut kartturi rauhoitteli kuskiaan rengasrikon jälkeen ja vakuutti, että kaikki on vielä mahdollista.","type":"text"}]},{"type":"paragraph","items":[{"text":"– Scottilla on ollut todella tärkeä rooli viime vuosien menestyksessä siitä lähtien, kun hän tuli mukaan. Urani varrella mukana on ollut niin paljon ihmisiä, ettei olisi reilua alkaa nimetä heitä yksitellen. Mutta todella monia ihmisiä on syytä kiittää.","type":"text"}]}],"aside":[],"keywords":["24h","Moottoriurheilu","Autourheilu ja urheiluautot","Liikunta ja urheilu","Rata-autoilu","Autot"],"functional_keywords":["author_aki_hietavala"],"updated_at":"2026-10-04T19:55:15+03:00","service_name":"iltalehti","main_image_name":"52fa3011647de7ce0971496075fcfb7a97518a0b62dac3cbafc9c5b3c0a575bc.jpg","metadata":{"longform":false,"sentiment":["Positive","Entertaining","Inspirational_Uplifting"],"alma_source":"","article_type":null,"hide_all_ads":false,"newspilot_id":"","canonical_url":"https://www.iltalehti.fi/ralli/a/13f52db7-8a39-4c49-beb3-9a24dc8a1ede","some_vignette":null,"author_location":"","sponsored_content":null,"recommendations_enabled":true},"subscription_level":null,"seo_keywords":[],"category":{"category_name":"ralli","description":"Ralli","is_commercial":false,"sidecolumns":[],"parent_category":{"category_name":"urheilu","description":"Urheilu","is_commercial":false,"sidecolumns":[],"parent_category":null}},"images":[{"image_name":"52fa3011647de7ce0971496075fcfb7a97518a0b62dac3cbafc9c5b3c0a575bc.jpg","source":"ZumaWire / MVPHOTOS","keywords":[],"width":1718,"height":1280,"caption":"Elfyn Evans (oik.) ja kartanlukija Scott Martin juhlivat rallin maailmanmestaruutta. ","float":"center","urls":{"default":"https://img.ilcdn.fi/CSezLIkSeAxFgCeN0-zPp2bnXOU=/653x0:2371x1280/full-fit-in/510x0/img-s3.ilcdn.fi/52fa3011647de7ce0971496075fcfb7a97518a0b62dac3cbafc9c5b3c0a575bc.jpg","size30":"https://img.ilcdn.fi/0YvIZZzZPtTXFR4kcmM0x6QM6tY=/653x0:2371x1280/full-fit-in/30x0/img-s3.ilcdn.fi/52fa3011647de7ce0971496075fcfb7a97518a0b62dac3cbafc9c5b3c0a575bc.jpg","size98":"https://img.ilcdn.fi/qYgAINiteAUvLd-
