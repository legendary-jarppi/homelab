# Shilly Shally News at http://news.lab.internal
# Needs secrets news-db (POSTGRES_PASSWORD) and news-llm (LLM_API_KEY), not in git; see apps/news/README.md.
# Build + apply: apps/news/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: news
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - networkpolicy.yaml
images:
  - name: localhost/news
    newTag: "20261004-220004"
configMapGenerator:
  # Hashed name: changes roll the pods.
  - name: news-config
    literals:
      # Origin per request from Traefik's headers (see apps/dashboard for why not a fixed ORIGIN).
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      - LLM_BASE_URL=https://api.proxy.ai.supercell.dev/v1
      - LLM_MODEL=claude-sonnet-5-5
      - CLASSIFY_CONCURRENCY=4
      - EDITION_TIME_ZONE=Europe/Helsinki
