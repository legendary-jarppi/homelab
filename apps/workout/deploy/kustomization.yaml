# Workout log at http://workout.lab.internal (no login; home network only)
# Needs secret workout-db (POSTGRES_PASSWORD), optional workout-api (SUMMARY_TOKEN), not in git; see
# apps/workout/README.md. Build + apply: apps/workout/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workout
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - networkpolicy.yaml
images:
  - name: localhost/workout
    newTag: "20261016-120248"
configMapGenerator:
  # Hashed name: changes roll the pod.
  - name: workout-config
    literals:
      # Origin per request from Traefik's headers (see apps/dashboard for why not a fixed ORIGIN).
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      # "Today" for the entry form and the current week.
      - TIME_ZONE=Europe/Helsinki
