# Enforced by k3s's embedded network policy controller.
#   homelab <- Traefik (homelab.lab.internal)
#   homelab -> Prometheus (all live status), DNS. Nothing else: the docs are bundled in the image.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homelab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homelab
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
