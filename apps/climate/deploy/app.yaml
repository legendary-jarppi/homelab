apiVersion: apps/v1
kind: Deployment
metadata:
  name: climate
  labels:
    app.kubernetes.io/name: climate
spec:
  # Changes to a device go through one process, one at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: climate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: climate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: climate
          # Built locally and imported into k3s (deploy.sh); never pulled.
          image: localhost/climate
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: climate-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: climate
  labels:
    app.kubernetes.io/name: climate
spec:
  selector:
    app.kubernetes.io/name: climate
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: climate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: climate
  endpoints:
    - port: http
      interval: 60s
