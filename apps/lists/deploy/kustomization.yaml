# Lists at http://lists.lab.internal
# Needs secrets lists-db (POSTGRES_PASSWORD) and lists-auth (PASSCODE, SESSION_SECRET), optional lists-api
# (DASHBOARD_TOKEN), not in git; see apps/lists/README.md. Build + apply: apps/lists/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lists
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - networkpolicy.yaml
images:
  - name: localhost/lists
    newTag: "20261014-195034"
configMapGenerator:
  # Hashed name: changes roll the pod.
  - name: lists-config
    literals:
      # Origin per request from Traefik's headers (see apps/dashboard for why not a fixed ORIGIN).
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      # Traefik appends the client address; used for login rate limiting.
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      # "Today" (default date of new items).
      - TIME_ZONE=Europe/Helsinki
