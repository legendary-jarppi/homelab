# Lists at http://lists.lab.internal (no login; home network only)
# Needs secret lists-db (POSTGRES_PASSWORD), optional lists-api (DASHBOARD_TOKEN), not in git; see
# apps/lists/README.md. Build + apply: apps/lists/deploy.sh (sets newTag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lists
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - networkpolicy.yaml
images:
  - name: localhost/lists
    newTag: "20261108-171744"
configMapGenerator:
  # Hashed name: changes roll the pod.
  - name: lists-config
    literals:
      # Origin per request from Traefik's headers (see apps/dashboard for why not a fixed ORIGIN).
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      # "Today" (default date of new items).
      - TIME_ZONE=Europe/Helsinki
