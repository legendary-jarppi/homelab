<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#070a12" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			// Red night mode before the first paint (no white or blue flash at the telescope): the last
			// state this device showed, kept by $lib/red.svelte.ts.
			try {
				if (localStorage.getItem('telescope.redActive') === '1') {
					document.documentElement.classList.add('red');
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
