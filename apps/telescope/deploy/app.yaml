apiVersion: apps/v1
kind: Deployment
metadata:
  name: telescope
  labels:
    app.kubernetes.io/name: telescope
spec:
  # One worker owns the archive and session files (RWO volumes): one replica, never two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telescope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telescope
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telescope
          # Built locally and imported into k3s (deploy.sh); never pulled.
          image: localhost/telescope
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: telescope-config
            # NOTIFY_TOKEN for apps/notify (optional: without it nothing is sent).
            - secretRef:
                name: telescope-notify
                optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # A frame is 18 MB raw and ~300 MB while analysed and warped; restacking reads the
            # aligned frames in row bands (~150 MB working set) through memory maps, whose pages
            # are reclaimable cache. Measured peak: see README (Stacking). An uploaded image is
            # decoded one at a time: ~800 MB peak for the service with a 261 MB 16-bit TIFF
            # (README, Own uploads); the 300 MB upload limit keeps it under the limit.
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: archive
              mountPath: /archive
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: telescope-archive
        - name: data
          persistentVolumeClaim:
            claimName: telescope-data
        # Aligned frames for restacking (float16, 13.6 MB each); rebuilt from the archive when
        # missing, pruned to CACHE_MAX_GB.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: telescope
  labels:
    app.kubernetes.io/name: telescope
spec:
  selector:
    app.kubernetes.io/name: telescope
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telescope
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: telescope
  endpoints:
    - port: http
      interval: 60s
