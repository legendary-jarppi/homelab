# The archive: every FITS (lights, Autorun Bias/Dark/Flat) and log from the ASIAIR, by night and
# target (~1.8 GB per 100 frames). Not in the nightly backup (EXCLUDE in
# platform/components/backup): the frames are large and still on the ASIAIR or its USB disk for a
# while; losing the archive loses only what the ASIAIR no longer has. local-path does not enforce
# the request.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telescope-archive
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 500Gi
---
# Sessions (numbers, decisions, guiding and telemetry history), stacks (32-bit FITS, ~27 MB each),
# previews (~0.5 MB per frame) and the owner's own uploaded images (original + decoded pixels +
# JPEGs, roughly 2–3 × the file each; up to 300 MB per file). Backed up nightly like every
# local-path volume. local-path neither enforces nor resizes the request (no allowVolumeExpansion):
# the directory lives on the node's /var/lib/rancher (~790 GB free), so uploads are bounded by the
# host's disk, not by this number; the upload endpoint refuses a file when under 1 GiB would remain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telescope-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
