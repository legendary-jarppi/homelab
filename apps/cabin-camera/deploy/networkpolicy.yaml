# Enforced by k3s's embedded network policy controller.
#   FTPS (2121, 50000-50009) <- anywhere: the camera is on 4G with a changing address
#   snapshots (8080)         <- dashboard only
#   outbound                 -> nothing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabin-camera
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cabin-camera
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 2121
        - port: 50000
          endPort: 50009
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard
      ports:
        - port: 8080
