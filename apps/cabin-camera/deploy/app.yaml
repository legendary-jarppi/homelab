apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabin-camera
  labels:
    app.kubernetes.io/name: cabin-camera
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cabin-camera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabin-camera
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # SFTPGo's and node's user: both read and write the snapshots volume.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # SFTPGo's atomic-upload folder (TEMP_PATH) must exist on the volume; its image has no shell.
      initContainers:
        - name: upload-folder
          image: localhost/cabin-camera
          imagePullPolicy: Never
          command: [mkdir, -p, /data/.uploading, /data/cabin]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshots
              mountPath: /data
      containers:
        # FTPS server for the camera, reachable from the internet (UDM Pro port forward).
        - name: ftp
          image: docker.io/drakkan/sftpgo:v2.7.6-distroless-slim
          envFrom:
            - configMapRef:
                name: cabin-ftp-config
          ports:
            - name: ftp
              containerPort: 2121
          # No probes: a TCP check would show up as a client connecting; a crash restarts the pod.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshots
              mountPath: /srv/sftpgo/data
            - name: secret
              mountPath: /etc/cabin
              readOnly: true
            - name: home
              mountPath: /var/lib/sftpgo
            - name: tmp
              mountPath: /tmp
        - name: snapshots
          # Built locally and imported into k3s (deploy.sh); never pulled.
          image: localhost/cabin-camera
          imagePullPolicy: Never
          env:
            - name: SNAPSHOT_DIR
              value: /data/cabin
            - name: RETENTION_DAYS
              value: "30"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshots
              mountPath: /data
      volumes:
        - name: snapshots
          persistentVolumeClaim:
            claimName: snapshots
        # users.json and the certificate from setup.sh; not the plain password copy.
        - name: secret
          secret:
            secretName: cabin-ftp
            items:
              - key: users.json
                path: users.json
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# FTPS on the node's address through ServiceLB: control port 2121 and the passive data range
# 50000-50009 (one per concurrent transfer). Local keeps client addresses for SFTPGo's ban list.
apiVersion: v1
kind: Service
metadata:
  name: ftp
  labels:
    app.kubernetes.io/name: cabin-camera
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: cabin-camera
  ports:
    - { name: ftp, port: 2121, targetPort: 2121 }
    - { name: pasv-0, port: 50000, targetPort: 50000 }
    - { name: pasv-1, port: 50001, targetPort: 50001 }
    - { name: pasv-2, port: 50002, targetPort: 50002 }
    - { name: pasv-3, port: 50003, targetPort: 50003 }
    - { name: pasv-4, port: 50004, targetPort: 50004 }
    - { name: pasv-5, port: 50005, targetPort: 50005 }
    - { name: pasv-6, port: 50006, targetPort: 50006 }
    - { name: pasv-7, port: 50007, targetPort: 50007 }
    - { name: pasv-8, port: 50008, targetPort: 50008 }
    - { name: pasv-9, port: 50009, targetPort: 50009 }
---
apiVersion: v1
kind: Service
metadata:
  name: snapshots
  labels:
    app.kubernetes.io/name: cabin-camera
spec:
  selector:
    app.kubernetes.io/name: cabin-camera
  ports:
    - name: http
      port: 8080
      targetPort: http
